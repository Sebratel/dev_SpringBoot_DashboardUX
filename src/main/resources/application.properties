spring.application.name=consolidador-bff
# 3210 e a porta padrao do stack (Docker/Portainer) - override via env SERVER_PORT.
server.port=3210

# Servico HTTP de automacao (Node/Playwright, container/porta 3212 propria -
# ver automation/src/server.js e automation/Dockerfile). Override via env
# AUTOMATION_BASE_URL (ex.: http://186.219.134.246:3212 em produção).
automation.base-url=http://localhost:3212
automation.poll-interval-ms=2000
# Ver AutomationProperties#publicHost - so precisa de override quando
# base-url usa um nome interno inalcancavel pelo browser (ex.: e2e local).
automation.public-host=

# Origens do frontend autorizadas a chamar a API (ver config/WebConfig.java).
# Lista separada por virgula - override via env APP_CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=http://localhost:5173,http://localhost:4200,http://localhost:3211
